name: Build and release

# Builds the plugin (Standalone + VST3) for Linux, Windows and macOS and, on a pushed `vX.Y.Z` tag, publishes
# a release. No ROM data is involved anywhere: the plugin reads the user's own Korg M1 ROM files at runtime
# (plugin/Source/M1RomLoader.cpp), so the binaries contain none and can be distributed. The ROMs themselves
# are never part of the repository or of a release.
#
# Same layout as Di-111-synth: the Linux build runs in an ubuntu:22.04 container (an AppImage uses the glibc
# of the machine it runs on, so it is fixed by the machine it was built on), update info and .zsync are
# embedded for the AppImage catalog, JUCE is fetched by CMake (FetchContent, 8.0.15).
on:
  push:
    branches: [ci/builds]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-latest
    container: ubuntu:22.04
    timeout-minutes: 60
    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential cmake git curl ca-certificates file binutils pkg-config zip \
            libasound2-dev libjack-jackd2-dev libfreetype-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev \
            libxrandr-dev libxrender-dev libglu1-mesa-dev mesa-common-dev \
            libcurl4-openssl-dev libgtk-3-dev libwebkit2gtk-4.1-dev zsync
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Cache JUCE
        uses: actions/cache@v4
        with:
          path: build/_deps/juce-src
          key: juce-8.0.15-me1-linux-v1
      - name: Configure
        run: cmake -S plugin -B build -DCMAKE_BUILD_TYPE=Release -DJUCE_DIR=/nonexistent
      - name: Build Standalone and VST3
        run: cmake --build build -j"$(nproc)" --target Me-1_Standalone Me-1_VST3
      - name: Assemble the zip and the AppImage
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          A=build/Me-1_artefacts/Release
          mkdir -p dist/Me-1_linux/Standalone dist/Me-1_linux/VST3
          cp "$A/Standalone/Me-1" dist/Me-1_linux/Standalone/
          cp -r "$A/VST3/Me-1.vst3" dist/Me-1_linux/VST3/
          cp README.md LICENSE dist/Me-1_linux/ 
          find dist/Me-1_linux -type f \( -name 'Me-1' -o -name '*.so' \) -exec strip {} +
          (cd dist && zip -qr Me-1_linux.zip Me-1_linux)
          echo "highest glibc symbol version needed:"
          objdump -T dist/Me-1_linux/Standalone/Me-1 | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1
          VERSION=$(git describe --tags --always)
          bash scripts/make_appimage.sh \
            --name Me-1 \
            --binary "$A/Standalone/Me-1" \
            --icon docs/app_icon_256.png \
            --comment "Korg M1 emulator (needs your own ROM files)" \
            --version "$VERSION" \
            --update-info "gh-releases-zsync|luginf|Me-1-synth|latest|Me-1-*x86_64.AppImage.zsync" \
            --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: me1-linux
          path: |
            dist/Me-1-x86_64.AppImage
            dist/Me-1-x86_64.AppImage.zsync
            dist/Me-1_linux.zip

  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      # toolset 14.44: same reason as Di-111-synth (MSVC 14.50's STL needs CreateFile2, a Windows 8+ export).
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
          toolset: 14.44
      - name: Cache JUCE
        uses: actions/cache@v4
        with:
          path: build/_deps/juce-src
          key: juce-8.0.15-me1-windows-v1
      - name: Configure
        shell: cmd
        run: cmake -S plugin -B build -G "Ninja Multi-Config" -DJUCE_DIR=C:/nonexistent
      - name: Build
        shell: cmd
        run: cmake --build build --config Release --target Me-1_VST3 Me-1_Standalone
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/Me-1_windows | Out-Null
          $a = Get-ChildItem -Recurse build -Filter Me-1.exe | Where-Object { $_.FullName -match 'Standalone' } | Select-Object -First 1
          Copy-Item $a.FullName dist/Me-1_windows/
          $v = Get-ChildItem -Recurse -Directory build -Filter Me-1.vst3 | Select-Object -First 1
          Copy-Item -Recurse $v.FullName dist/Me-1_windows/Me-1.vst3
          Copy-Item README.md, LICENSE dist/Me-1_windows/
          Compress-Archive -Path dist/Me-1_windows -DestinationPath dist/Me-1_windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: me1-windows
          path: dist/Me-1_windows.zip
          if-no-files-found: error

  macos:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Cache JUCE
        uses: actions/cache@v4
        with:
          path: build/_deps/juce-src
          key: juce-8.0.15-me1-macos-v1
      # Universal binary (arm64 + x86_64), minimum macOS 11, unsigned (right-click > Open the first time).
      - name: Configure
        run: cmake -S plugin -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 -DJUCE_DIR=/nonexistent
      - name: Build
        run: cmake --build build --config Release --target Me-1_VST3 Me-1_Standalone -j"$(sysctl -n hw.ncpu)"
      - name: Package
        run: |
          A=build/Me-1_artefacts/Release
          mkdir -p dist/Me-1_macos
          cp -R "$A/Standalone/Me-1.app" dist/Me-1_macos/
          cp -R "$A/VST3/Me-1.vst3" dist/Me-1_macos/
          cp README.md LICENSE dist/Me-1_macos/
          (cd dist && zip -qry Me-1_macos.zip Me-1_macos)
      - uses: actions/upload-artifact@v4
        with:
          name: me1-macos
          path: dist/Me-1_macos.zip
          if-no-files-found: error

  release:
    name: Release
    needs: [linux, windows, macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: me1-*
          merge-multiple: true
      - run: ls -R dist
      - uses: softprops/action-gh-release@v2
        with:
          name: "Me-1 ${{ github.ref_name }}"
          prerelease: false
          generate_release_notes: true
          body: |
            Korg M1 emulator plugin (Standalone + VST3). **No ROMs are included**: you need your own Korg M1 ROM set (see README, "Locate ROMs..." in the editor).
            macOS builds are unsigned (right-click > Open the first time).
          files: |
            dist/**/*
